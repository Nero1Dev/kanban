<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Painel de Serviços</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%23110D0A%22/><text x=%2250%22 y=%2268%22 font-size=%2260%22 font-family=%22Arial%22 font-weight=%22900%22 fill=%22%23C99A44%22 text-anchor=%22middle%22>K</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="noise"></div>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">K.</span><span class="brand-name">PAINEL</span>
  </div>
  <div class="topbar-right">
    <span class="place" id="today-label">— HOJE</span>
  </div>
</header>

<main class="hero">
  <div class="hero-label"><span class="dash">—</span> GESTÃO DE TRABALHO</div>
  <h1 class="hero-title">
    <span class="line line-fill">MEUS</span>
    <span class="line line-outline">SERVIÇOS</span>
  </h1>
  <p class="hero-sub">Organize seus serviços, acompanhe o andamento e não perca nenhuma descrição, prazo ou cliente de vista.</p>
</main>

<section class="toolbar">
  <div class="toolbar-left">
    <input type="text" id="search-input" class="search-input" placeholder="BUSCAR SERVIÇO, CLIENTE...">
  </div>
  <div class="toolbar-right">
    <button class="btn btn-ghost" id="export-btn">EXPORTAR ▾</button>
    <button class="btn btn-ghost" id="import-btn">IMPORTAR ▴</button>
    <input type="file" id="import-file" accept="application/json" hidden>
    <button class="btn btn-outline" id="add-column-btn">+ NOVA COLUNA</button>
    <button class="btn btn-solid" id="add-card-btn">+ NOVO SERVIÇO</button>
  </div>
</section>

<section class="board-wrap">
  <div class="board" id="board"></div>
</section>

<footer class="footer">
  <span>— SEUS DADOS FICAM SALVOS NESTE NAVEGADOR</span>
  <span class="footer-dot">•</span>
  <span>USE "EXPORTAR" PARA FAZER BACKUP</span>
</footer>

<!-- Modal: Cartão (serviço) -->
<div class="modal-overlay" id="card-modal-overlay">
  <div class="modal">
    <div class="modal-head">
      <span class="modal-label"><span class="dash">—</span> <span id="card-modal-title">NOVO SERVIÇO</span></span>
      <button class="modal-close" id="card-modal-close">✕</button>
    </div>
    <form id="card-form">
      <label class="field">
        <span class="field-label">TÍTULO DO SERVIÇO</span>
        <input type="text" id="field-title" required placeholder="Ex: Ensaio fotográfico - Família Silva">
      </label>

      <label class="field">
        <span class="field-label">DESCRIÇÃO</span>
        <textarea id="field-desc" rows="4" placeholder="Detalhes do serviço, escopo, observações..."></textarea>
      </label>

      <div class="field-row">
        <label class="field">
          <span class="field-label">CLIENTE</span>
          <input type="text" id="field-client" placeholder="Nome do cliente">
        </label>
        <label class="field">
          <span class="field-label">VALOR (R$)</span>
          <input type="text" id="field-value" placeholder="0,00" inputmode="decimal">
        </label>
      </div>

      <div class="field-row">
        <label class="field">
          <span class="field-label">PRAZO</span>
          <input type="date" id="field-date">
        </label>
        <label class="field">
          <span class="field-label">PRIORIDADE</span>
          <select id="field-priority">
            <option value="baixa">Baixa</option>
            <option value="media" selected>Média</option>
            <option value="alta">Alta</option>
          </select>
        </label>
      </div>

      <label class="field">
        <span class="field-label">COLUNA</span>
        <select id="field-column"></select>
      </label>

      <div class="modal-actions">
        <button type="button" class="btn btn-danger" id="card-delete-btn">EXCLUIR</button>
        <div class="modal-actions-right">
          <button type="button" class="btn btn-ghost" id="card-cancel-btn">CANCELAR</button>
          <button type="submit" class="btn btn-solid">SALVAR</button>
        </div>
      </div>
    </form>
  </div>
</div>

<!-- Modal: confirmar exclusão de coluna -->
<div class="modal-overlay" id="confirm-modal-overlay">
  <div class="modal modal-small">
    <div class="modal-head">
      <span class="modal-label"><span class="dash">—</span> CONFIRMAR</span>
      <button class="modal-close" id="confirm-modal-close">✕</button>
    </div>
    <p class="confirm-text" id="confirm-text"></p>
    <div class="modal-actions">
      <div></div>
      <div class="modal-actions-right">
        <button type="button" class="btn btn-ghost" id="confirm-cancel-btn">CANCELAR</button>
        <button type="button" class="btn btn-danger" id="confirm-ok-btn">CONFIRMAR</button>
      </div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
